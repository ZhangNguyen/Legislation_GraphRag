[project]
name = "legislation-rag"
version = "0.1.0"
description = "Legal RAG system responsible for asking and answering from users' response"
requires-python = ">=3.8"

dependencies = [
    # API
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.20.0",

    # LLM + RAG
    "langchain>=0.0.300",
    "langchain-openai>=0.0.1",
    "openai>=0.27.0",

    # Vector DB
    "qdrant-client>=1.7.0",

    # Embeddings
    # note: sentence-transformers may pull heavy deps; keep if needed
    "sentence-transformers>=2.2.0",

    # Data loading
    "pypdf>=3.0.0",

    # OCR pipeline
    "ocrmypdf>=13.0.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "Pillow>=9.0.0",

    # Config & schema
    "python-dotenv>=0.19.0",
    "pydantic>=1.8.0",

    # Utilities
    "requests>=2.28.0",
    "numpy>=1.21.0",
    "tqdm>=4.62.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
